<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Klien Nauvite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #17261f;
    --emas: #c99c34;
    --emas-teks: #96711f;
    --kertas: #f3eee5;
    --garis: rgba(23, 38, 31, 0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--kertas);
    color: var(--tinta);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    font-size: 15px;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 24px;
    background: var(--tinta); color: var(--kertas);
  }
  header img { height: 34px; }
  header h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 21px; margin: 0; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .75; }
  main {
    display: grid; gap: 28px;
    grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
    max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px;
  }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; padding: 20px 16px 48px; }
    .pratinjau { order: -1; }
  }
  .panel {
    background: #fbf8f2; border: 1px solid var(--garis); border-radius: 18px;
    padding: 20px; display: grid; gap: 18px; align-content: start;
  }
  h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 17px; margin: 0 0 -6px; }
  label { display: grid; gap: 6px; font-weight: 500; font-size: 14px; }
  .hint { font-weight: 400; font-size: 13px; color: rgba(23, 38, 31, .65); margin: 0; }
  input[type=text], textarea, select {
    font: inherit; color: inherit; width: 100%;
    padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--garis); background: #fff;
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--emas); outline-offset: 1px; }
  .unggah {
    display: grid; gap: 4px; padding: 14px; border-radius: 12px;
    border: 1.5px dashed rgba(23, 38, 31, .3); background: #fff; cursor: pointer;
  }
  .unggah input { font-size: 13px; }
  .baris { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    padding: 10px 16px; border-radius: 999px;
    border: 1px solid var(--tinta); background: transparent; color: var(--tinta);
  }
  button:hover { background: rgba(23, 38, 31, .06); }
  button.utama { background: var(--tinta); color: var(--kertas); width: 100%; padding: 14px; font-size: 16px; }
  button.utama:hover { background: #22372d; }
  button[aria-pressed=true] { background: var(--tinta); color: var(--kertas); }
  input[type=range] { width: 100%; accent-color: var(--emas); }
  .pratinjau { display: grid; gap: 12px; justify-items: center; align-content: start; }
  .pratinjau p { margin: 0; text-align: center; max-width: 420px; }
  canvas {
    width: min(100%, 420px); height: auto; border-radius: 16px;
    box-shadow: 0 18px 50px rgba(23, 38, 31, .18);
    touch-action: none; background: var(--kertas);
  }
  canvas.sensor { cursor: crosshair; }
  .status { font-size: 13px; color: var(--emas-teks); min-height: 18px; }
</style>
</head>

  <div>
    <h1>Story Klien</h1>
    <p>Bikin gambar story bukti TF lengkap dengan watermark Nauvite</p>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Gambar</h2>
    <label class="unggah">Screenshot bukti TF
      <input type="file" id="gambar1" accept="image/*">
    </label>
    <label class="unggah">Screenshot undangan di HP <span class="hint">(boleh dikosongkan)</span>
      <input type="file" id="gambar2" accept="image/*">
    </label>

    <h2>Sensor</h2>
    <p class="hint">Tekan tombol di bawah, lalu tarik kotak di pratinjau untuk menutup nama lengkap, nomor rekening, saldo, nomor referensi, atau nomor HP.</p>
    <div class="baris">
      <button type="button" id="modeSensor" aria-pressed="false">Mulai sensor</button>
      <button type="button" id="batal">Batalkan kotak terakhir</button>
      <button type="button" id="hapusSensor">Hapus semua</button>
    </div>

    <h2>Tulisan</h2>
    <label>Nama pasangan
      <input type="text" id="nama" value="Tria & Alziad">
    </label>
    <label>Tema dan tanggal
      <input type="text" id="sub" value="Tema Royal Gold, 28 November 2026">
    </label>
    <label>Pilih ucapan
      <select id="preset">
        <option value="0">Terima kasih sudah percaya sama Nauvite</option>
        <option value="1">Order masuk lagi, undangan sudah disebar</option>
        <option value="2">Revisi cepat beres, undangan sudah live</option>
        <option value="tulis">Tulis sendiri</option>
      </select>
    </label>
    <label>Panggilan klien
      <input type="text" id="panggilan" value="Tria">
    </label>
    <label>Ucapan
      <textarea id="ucapan"></textarea>
    </label>
    <label>Teks paling bawah
      <input type="text" id="kaki" value="nauvite.id">
    </label>

    <h2>Watermark</h2>
    <label>Tulisan miring di atas screenshot
      <input type="range" id="opMiring" min="0" max="30" value="12">
    </label>
    <label>Logo di pojok screenshot
      <input type="range" id="opLogo" min="0" max="100" value="80">
    </label>

    <button type="button" class="utama" id="unduh">Unduh gambar story</button>
    <div class="status" id="status"></div>
  </section>

  <section class="pratinjau">
    <canvas id="kanvas" width="1080" height="1920"></canvas>
    <p class="hint" id="petunjuk">Masukkan screenshot bukti TF dulu.</p>
  </section>
</main>

  const gambar = [null, null];
  // kotak sensor, koordinat 0..1 relatif terhadap gambar asli
  let sensor = [];
  let kotakGambar = [];   // posisi gambar di kanvas saat ini
  let tarik = null;       // kotak sensor yang sedang ditarik

  const preset = [
    "Terima kasih Kak {panggilan} sudah percaya sama Nauvite. Semoga lancar sampai hari H ya.",
    "Order masuk lagi. Undangannya sudah jadi dan sudah disebar ke tamu.",
    "Makasih Kak {panggilan}, revisinya cepat beres dan undangannya sudah live.",
  ];

  function isiUcapanDariPreset() {
    const v = $("preset").value;
    if (v === "tulis") return;
    const p = $("panggilan").value.trim() || "kak";
    $("ucapan").value = preset[+v].replace("{panggilan}", p);
  }

  function muatGambar(input, i) {
    input.addEventListener("change", () => {
      const f = input.files && input.files[0];
      if (!f) { gambar[i] = null; sensor = sensor.filter((s) => s.i !== i); gambar_(); return; }
      const img = new Image();
      img.onload = () => {
        img.terang = kecerahan(img) > 0.55;
        gambar[i] = img;
        sensor = sensor.filter((s) => s.i !== i);
        gambar_();
      };
      img.src = URL.createObjectURL(f);
    });
  }

  function kecerahan(img) {
    const c = document.createElement("canvas");
    c.width = 32; c.height = 32;
    const x = c.getContext("2d");
    x.drawImage(img, 0, 0, 32, 32);
    const d = x.getImageData(0, 0, 32, 32).data;
    let total = 0;
    for (let n = 0; n < d.length; n += 4) total += (0.299 * d[n] + 0.587 * d[n + 1] + 0.114 * d[n + 2]) / 255;
    return total / (d.length / 4);
  }

  function gambar_() { requestAnimationFrame(lukis); }

  function kotakBulat(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function pecahBaris(teks, lebarMaks) {
    const kata = teks.split(/\s+/).filter(Boolean);
    const baris = [];
    let kini = "";
    for (const k of kata) {
      const coba = kini ? kini + " " + k : k;
      if (ctx.measureText(coba).width > lebarMaks && kini) { baris.push(kini); kini = k; }
      else kini = coba;
    }
    if (kini) baris.push(kini);
    return baris;
  }

  function hitungTata() {
    const atas = 440, bawah = 1490, kiri = 80, kanan = W - 80;
    const ada = gambar.map((g, i) => (g ? i : -1)).filter((i) => i >= 0);
    const tinggiArea = bawah - atas;
    const jarak = 40;
    const lebarSlot = ada.length === 2 ? (kanan - kiri - jarak) / 2 : kanan - kiri;
    const hasil = [];
    ada.forEach((i, n) => {
      const g = gambar[i];
      const skala = Math.min(lebarSlot / g.width, tinggiArea / g.height);
      const w = g.width * skala, h = g.height * skala;
      const slotX = kiri + n * (lebarSlot + jarak);
      hasil.push({ i, x: slotX + (lebarSlot - w) / 2, y: atas + (tinggiArea - h) / 2, w, h });
    });
    return hasil;
  }

  function lukis() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = KERTAS;
    ctx.fillRect(0, 0, W, H);

    // lengkung dari logo, tipis di belakang
    ctx.save();
    ctx.strokeStyle = EMAS;
    ctx.globalAlpha = 0.28;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(W / 2, 980, 600, Math.PI * 0.66, Math.PI * 0.34);
    ctx.stroke();
    ctx.globalAlpha = 0.16;
    ctx.beginPath();
    ctx.arc(W / 2, 980, 630, Math.PI * 0.68, Math.PI * 0.32);
    ctx.stroke();
    ctx.restore();

    // logo atas
    if (logo.complete && logo.naturalWidth) {
      const lw = 92, lh = lw * logo.naturalHeight / logo.naturalWidth;
      ctx.drawImage(logo, W / 2 - lw / 2, 112, lw, lh);
    }

    // judul
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = TINTA;
    const judul = ("Undangan " + $("nama").value.trim()).trim();
    let ukuran = 68;
    do { ctx.font = `600 ${ukuran}px ${SERIF}`; ukuran -= 2; } while (ctx.measureText(judul).width > 920 && ukuran > 36);
    ctx.fillText(judul, W / 2, 318);

    ctx.font = `500 34px ${SANS}`;
    ctx.fillStyle = EMAS_TEKS;
    ctx.fillText($("sub").value.trim(), W / 2, 378);

    // screenshot
    kotakGambar = hitungTata();
    for (const k of kotakGambar) {
      const g = gambar[k.i];
      ctx.save();
      ctx.shadowColor = "rgba(23, 38, 31, 0.22)";
      ctx.shadowBlur = 44;
      ctx.shadowOffsetY = 18;
      kotakBulat(k.x, k.y, k.w, k.h, 26);
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.restore();

      ctx.save();
      kotakBulat(k.x, k.y, k.w, k.h, 26);
      ctx.clip();
      ctx.drawImage(g, k.x, k.y, k.w, k.h);
      ctx.fillStyle = TINTA;
      for (const s of sensor.filter((s) => s.i === k.i)) {
        kotakBulat(k.x + s.x * k.w, k.y + s.y * k.h, s.w * k.w, s.h * k.h, 6);
        ctx.fill();
      }
      if (tarik && tarik.i === k.i) {
        ctx.globalAlpha = 0.6;
        const r = normal(tarik);
        kotakBulat(k.x + r.x * k.w, k.y + r.y * k.h, r.w * k.w, r.h * k.h, 6);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // tulisan miring berulang
      const op = +$("opMiring").value / 100;
      if (op > 0) {
        ctx.globalAlpha = g.terang ? op : Math.min(1, op * 1.4);
        ctx.fillStyle = g.terang ? TINTA : KERTAS;
        ctx.font = `600 46px ${SERIF}`;
        ctx.textAlign = "center";
        const cx = k.x + k.w / 2, cy = k.y + k.h / 2;
        ctx.translate(cx, cy);
        ctx.rotate(-Math.PI / 7);
        const jangkau = Math.hypot(k.w, k.h) / 2 + 200;
        let baris = 0;
        for (let y = -jangkau; y < jangkau; y += 150, baris++) {
          const geser = baris % 2 ? 140 : 0;
          for (let x = -jangkau; x < jangkau; x += 280) ctx.fillText("nauvite", x + geser, y);
        }
      }
      ctx.restore();

      ctx.save();
      kotakBulat(k.x, k.y, k.w, k.h, 26);
      ctx.strokeStyle = "rgba(23, 38, 31, 0.14)";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    // logo pojok di gambar pertama (bukti TF), ikut terpotong kalau di-crop
    const opLogo = +$("opLogo").value / 100;
    const utama = kotakGambar.find((k) => k.i === 0) || kotakGambar[0];
    if (utama && opLogo > 0 && logo.complete && logo.naturalWidth) {
      const r = 52;
      const cx = utama.x + utama.w - r - 22, cy = utama.y + utama.h - r - 22;
      ctx.save();
      ctx.globalAlpha = opLogo;
      ctx.fillStyle = TINTA;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      const lw = 66, lh = lw * logo.naturalHeight / logo.naturalWidth;
      ctx.drawImage(logo, cx - lw / 2, cy - lh / 2 + 2, lw, lh);
      ctx.restore();
    }

    if (!kotakGambar.length) {
      ctx.save();
      kotakBulat(160, 520, W - 320, 900, 26);
      ctx.setLineDash([14, 12]);
      ctx.strokeStyle = "rgba(23, 38, 31, 0.3)";
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = "rgba(23, 38, 31, 0.5)";
      ctx.font = `500 34px ${SANS}`;
      ctx.textAlign = "center";
      ctx.fillText("Screenshot bukti TF", W / 2, 980);
      ctx.restore();
    }

    // ucapan
    ctx.textAlign = "center";
    ctx.fillStyle = TINTA;
    ctx.font = `500 40px ${SANS}`;
    const baris = pecahBaris($("ucapan").value.trim(), 880).slice(0, 4);
    const tinggiBaris = 58;
    const mulai = 1590 + (4 - baris.length) * tinggiBaris / 4;
    baris.forEach((b, n) => ctx.fillText(b, W / 2, mulai + n * tinggiBaris));

    // kaki
    ctx.font = `600 30px ${SANS}`;
    ctx.fillStyle = EMAS_TEKS;
    ctx.fillText($("kaki").value.trim(), W / 2, 1850);

    $("petunjuk").textContent = kotakGambar.length
      ? ($("modeSensor").getAttribute("aria-pressed") === "true"
          ? "Tarik kotak di atas bagian yang mau ditutup."
          : "Cek lagi bagian sensitif sudah tertutup sebelum diunduh.")
      : "Masukkan screenshot bukti TF dulu.";
  }

  function normal(t) {
    const x = Math.min(t.x0, t.x1), y = Math.min(t.y0, t.y1);
    return { i: t.i, x, y, w: Math.abs(t.x1 - t.x0), h: Math.abs(t.y1 - t.y0) };
  }

  function titikKanvas(e) {
    const r = kanvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }

  const batasi = (v) => Math.max(0, Math.min(1, v));

  kanvas.addEventListener("pointerdown", (e) => {
    if ($("modeSensor").getAttribute("aria-pressed") !== "true") return;
    const p = titikKanvas(e);
    const k = kotakGambar.find((k) => p.x >= k.x && p.x <= k.x + k.w && p.y >= k.y && p.y <= k.y + k.h);
    if (!k) return;
    const u = (p.x - k.x) / k.w, v = (p.y - k.y) / k.h;
    tarik = { i: k.i, x0: u, y0: v, x1: u, y1: v };
    kanvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  kanvas.addEventListener("pointermove", (e) => {
    if (!tarik) return;
    const k = kotakGambar.find((k) => k.i === tarik.i);
    const p = titikKanvas(e);
    tarik.x1 = batasi((p.x - k.x) / k.w);
    tarik.y1 = batasi((p.y - k.y) / k.h);
    gambar_();
  });
  const selesaiTarik = () => {
    if (!tarik) return;
    const r = normal(tarik);
    tarik = null;
    if (r.w > 0.01 && r.h > 0.005) sensor.push(r);
    gambar_();
  };
  kanvas.addEventListener("pointerup", selesaiTarik);
  kanvas.addEventListener("pointercancel", selesaiTarik);

  $("modeSensor").addEventListener("click", (e) => {
    const nyala = e.currentTarget.getAttribute("aria-pressed") !== "true";
    e.currentTarget.setAttribute("aria-pressed", String(nyala));
    e.currentTarget.textContent = nyala ? "Selesai sensor" : "Mulai sensor";
    kanvas.classList.toggle("sensor", nyala);
    gambar_();
  });
  $("batal").addEventListener("click", () => { sensor.pop(); gambar_(); });
  $("hapusSensor").addEventListener("click", () => { sensor = []; gambar_(); });

  $("preset").addEventListener("change", () => { isiUcapanDariPreset(); gambar_(); });
  $("panggilan").addEventListener("input", () => { isiUcapanDariPreset(); gambar_(); });
  $("ucapan").addEventListener("input", () => { $("preset").value = "tulis"; gambar_(); });
  for (const id of ["nama", "sub", "kaki", "opMiring", "opLogo"]) $(id).addEventListener("input", gambar_);

  muatGambar($("gambar1"), 0);
  muatGambar($("gambar2"), 1);

  $("unduh").addEventListener("click", () => {
    if (!gambar[0] && !gambar[1]) { $("status").textContent = "Masukkan screenshot dulu ya."; return; }
    lukis();
    kanvas.toBlob((blob) => {
      const nama = ($("nama").value.trim() || "klien").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `story-${nama || "klien"}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      $("status").textContent = "Gambar tersimpan di folder Unduhan.";
    }, "image/png");
  });

  isiUcapanDariPreset();
  logo.onload = gambar_;
  gambar_();
  if (document.fonts) document.fonts.ready.then(gambar_);
  // pastikan font dipakai di kanvas walau belum muncul di halaman
  if (document.fonts) Promise.all([
    document.fonts.load(`600 68px Fraunces`),
    document.fonts.load(`500 40px "Plus Jakarta Sans"`),
    document.fonts.load(`600 30px "Plus Jakarta Sans"`),
  ]).then(gambar_).catch(() => {});
})();
</script>
</body>
</html>
